<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CoopTrack</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2906/2906275.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
.left {
    flex: 1.1;
    background: linear-gradient(rgba(15,46,29,0.75), rgba(15,46,29,0.85)),
                url('https://images.unsplash.com/photo-1625246333195-78d9c38ad449?w=1400&q=80') center/cover;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 50px;
    color: white;
}
        .left h1 {
            font-size: 2.6rem;
            font-weight: 700;
            margin: 0 0 12px;
        }
        .left p {
            margin: 0;
            opacity: 0.9;
            font-size: 1.05rem;
            max-width: 420px;
        }
        .right {
            flex: 0.9;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }
        .box {
            width: 100%;
            max-width: 400px;
        }
        .btn-success {
            background: #16a34a;
            border: none;
        }
        .btn-success:hover {
            background: #15803d;
        }
        @media (max-width: 900px) {
            .left { display: none; }
        }
    </style>
</head>
<body>
    <div class="left">
        <h1>Join CoopTrack</h1>
        <p>Create your staff account and start managing farmer deliveries, payments and stock records.</p>
    </div>

    <div class="right">
        <div class="box">
            <div class="text-center mb-4">
                <div style="font-size:48px;">🌾</div>
                <h2 class="fw-bold" style="color:#166534;">Create Account</h2>
                <p class="text-muted mb-0">Staff Registration</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-danger{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Username</label>
                    <input type="text" name="username" class="form-control form-control-lg" placeholder="Choose a username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" name="email" class="form-control form-control-lg" placeholder="you@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" name="password" class="form-control form-control-lg" placeholder="Create a password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control form-control-lg" placeholder="Repeat password" required>
                </div>
                <button type="submit" class="btn btn-success w-100 btn-lg">Register</button>
            </form>

            <div class="text-center mt-4">
                <p class="mb-0">Already have an account? <a href="{% url 'login' %}" class="text-success fw-bold">Login</a></p>
            </div>
        </div>
    </div>
</body>
</html>
