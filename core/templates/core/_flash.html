<div class="flash-wrap no-print">
{% for message in messages %}{% if 'contact' not in message.tags %}
    <div class="alert alert-{% if message.level_tag == 'error' %}danger{% else %}{{ message.level_tag }}{% endif %} alert-dismissible fade show" role="alert">
        <i class="bi {% if message.level_tag == 'success' %}bi-check-circle-fill{% elif message.level_tag == 'error' %}bi-x-circle-fill{% else %}bi-exclamation-triangle-fill{% endif %} me-2"></i>{{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
{% endif %}{% endfor %}
</div>
